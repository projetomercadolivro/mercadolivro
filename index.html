<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/css/style.css">
    <title>MercadoLivro</title>
</head>
<body>
    <header>
        <h1>Mercado Livro</h1>
        <img src="src/assets/LivroAberto.webp" alt="Livro aberto" class="Logo">
        <input type="text" placeholder="Pesquisar...">
        <ul>
            <li><a href="#">Destaques</a></li>
            <li><a href="#">Crie Uma Conta</a></li>
            <li><a href="#">Login</a></li>
        </ul>
        </ul>  

        <button class="btn-tema">
            <img src="src/assets/ModoEscuro.png" alt="Tema" class="Tema">
        </button>
        <button class="btn-carrinho">
            <img src="src/assets/CrinhoDeCompras.png" alt="Carrinho de compras" class="CarrinhoDeCompras">
        </button>
    </header>

    <main>
        <section id="cards">
            <h2>Destaques</h2>

            <div class="grade-livros">
                <article class="card-livro">
                    <img src="src/assets/livro1.jpg" alt="Capa do primeiro livro">
                    <h3>Livro 1</h3>
                    <p>Descrição do primeiro livro.</p>
                    <button type="button">Comprar</button>
                </article>

                <article class="card-livro">
                    <img src="src/assets/livro2.jpg" alt="Capa do segundo livro">
                    <h3>Livro 2</h3>
                    <p>Descrição do segundo livro.</p>
                    <button type="button">Comprar</button>
                </article>

                <article class="card-livro">
                    <img src="src/assets/livro3.jpg" alt="Capa do terceiro livro">
                    <h3>Livro 3</h3>
                    <p>Descrição do terceiro livro.</p>
                    <button type="button">Comprar</button>
                </article>
            </div>
        </section>
    </main>

    <script src="./src/js/script.js"></script>
</body>
</html>
